[package]
name = "prw-registry"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
prw-connectivity = { path = "../prw-connectivity" }
prw-control-plane = { path = "../prw-control-plane" }
prw-core = { path = "../prw-core" }
prw-session = { path = "../prw-session" }

[target.'cfg(target_os = "linux")'.dependencies]
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
rustix = { version = "=1.1.4", default-features = false, features = ["std", "process"] }

[dev-dependencies]
aws-lc-rs = { version = "=1.18.0", default-features = false, features = ["alloc", "non-fips"] }
prw-device-identity-signer = { path = "../prw-device-identity-signer" }

[lints]
workspace = true
