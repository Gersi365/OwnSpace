name: Ownspace desktop refresh visible status preservation source package

on:
  push:
    branches:
      - "promotion/desktop-refresh-visible-status-preservation-r1"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout packaging carrier
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify validated source input
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BASE=53aa8525e6f7ebe31583320b06f1a8e581348c63
          EXPECTED_UI_BLOB=b9536a0ff987b2eae55610050cd0e5151eeb80d6
          EXPECTED_README_BLOB=b0046a5c1f53ba7e61bb46877299917ff24f6c6c
          git cat-file -e "$EXPECTED_BASE^{commit}"
          git merge-base --is-ancestor "$EXPECTED_BASE" HEAD
          test "$(git rev-parse HEAD:apps/desktop/src/ui.rs)" = "$EXPECTED_UI_BLOB"
          test "$(git rev-parse HEAD:apps/desktop/README.md)" = "$EXPECTED_README_BLOB"
          mapfile -t changed < <(git diff --name-only "$EXPECTED_BASE" HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" = "3"
          test "${changed[0]}" = ".github/workflows/desktop-refresh-visible-status-preservation-source-package.yml"
          test "${changed[1]}" = "apps/desktop/README.md"
          test "${changed[2]}" = "apps/desktop/src/ui.rs"
          echo "EXPECTED_BASE=$EXPECTED_BASE" >> "$GITHUB_ENV"
          echo "EXPECTED_UI_BLOB=$EXPECTED_UI_BLOB" >> "$GITHUB_ENV"
          echo "EXPECTED_README_BLOB=$EXPECTED_README_BLOB" >> "$GITHUB_ENV"

      - name: Construct source-only candidate
        shell: bash
        run: |
          set -euo pipefail
          export GIT_INDEX_FILE="$RUNNER_TEMP/ownspace-refresh-visible-status.index"
          rm -f "$GIT_INDEX_FILE"
          git read-tree "$EXPECTED_BASE^{tree}"
          UI_MODE="$(git ls-tree "$EXPECTED_BASE" -- apps/desktop/src/ui.rs | awk '{print $1}')"
          README_MODE="$(git ls-tree "$EXPECTED_BASE" -- apps/desktop/README.md | awk '{print $1}')"
          test "$UI_MODE" = "100644"
          test "$README_MODE" = "100644"
          git update-index --add --cacheinfo "$UI_MODE" "$EXPECTED_UI_BLOB" apps/desktop/src/ui.rs
          git update-index --add --cacheinfo "$README_MODE" "$EXPECTED_README_BLOB" apps/desktop/README.md
          TREE_SHA="$(git write-tree)"
          test "$(git ls-tree -r --name-only "$TREE_SHA" | wc -l | tr -d ' ')" = "372"
          mkdir -p source package-output
          git archive "$TREE_SHA" | tar -x -C source
          test "$(find source -type f | wc -l | tr -d ' ')" = "372"
          cp source/apps/desktop/src/ui.rs package-output/ui.rs
          cp source/apps/desktop/README.md package-output/README.md
          (
            cd source
            find . -type f -print0 | sort -z | xargs -0 sha256sum
          ) > package-output/OWNSPACE_SOURCE_MANIFEST_SHA256.txt
          (
            cd source
            tar --sort=name --mtime='2026-09-25 00:00:00 UTC' --owner=0 --group=0 --numeric-owner --format=gnu -cf - . | gzip -n -6
          ) > package-output/Ownspace_Source_Current_2026-09-25.tar.gz
          {
            echo "OWNSPACE DESKTOP REFRESH VISIBLE STATUS PRESERVATION SOURCE PACKAGE"
            echo "BASE_MAIN=$EXPECTED_BASE"
            echo "VALIDATED_CARRIER_HEAD=183084a4166f5dfa69315e452f205f7e1c10ccf9"
            echo "VALIDATED_SOURCE_COMMIT=9a925af59643656ead627c533d36f90ba5396384"
            echo "SOURCE_TREE=$TREE_SHA"
            echo "SOURCE_FILES=372"
            echo "UI_BLOB=$EXPECTED_UI_BLOB"
            echo "README_BLOB=$EXPECTED_README_BLOB"
            echo "UI_SHA256=$(sha256sum package-output/ui.rs | awk '{print $1}')"
            echo "README_SHA256=$(sha256sum package-output/README.md | awk '{print $1}')"
            echo "MANIFEST_SHA256=$(sha256sum package-output/OWNSPACE_SOURCE_MANIFEST_SHA256.txt | awk '{print $1}')"
            echo "ARCHIVE_SHA256=$(sha256sum package-output/Ownspace_Source_Current_2026-09-25.tar.gz | awk '{print $1}')"
            echo "ARCHIVE_BYTES=$(wc -c < package-output/Ownspace_Source_Current_2026-09-25.tar.gz | tr -d ' ')"
          } > package-output/package-info.txt
          cat package-output/package-info.txt

      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: ownspace-desktop-refresh-visible-status-preservation-source-package
          path: package-output/
          if-no-files-found: error
          retention-days: 14
