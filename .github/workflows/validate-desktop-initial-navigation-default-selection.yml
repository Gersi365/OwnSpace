name: Ownspace Desktop initial navigation default selection validation

on:
  push:
    branches:
      - validation/desktop-initial-navigation-default-selection-2026-09-28

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation carrier
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify exact carrier and candidate
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA='532158b332da5ee1ec3c14c8b464172bfd8783e9'
          BASE_UI_SHA256='03ee06cfe9eefb24f98dc4ee31ff74426df5f27bfed525a7ac03a2df3d7d3466'
          BASE_STATE_SHA256='aa1ee9c4b61912e0a7a3c291269491780d4944c0fa197d17c75e5f135aba6941'
          PATCH_SHA256='ce10b6a35af1133223aec8a2a4fa80508ae469356113cfe3e9a013cdac1d4bd6'
          FINAL_UI_SHA256='db0c523fffd14f6a715271e5a180d64aec4ccdf584cd32121cb672cb6dca41b6'
          PATCH='.github/validation/OWNSPACE_DESKTOP_INITIAL_NAVIGATION_DEFAULT_SELECTION_CANDIDATE_2026-09-28.patch'

          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(sha256sum apps/desktop/src/ui.rs | awk '{print $1}')" = "$BASE_UI_SHA256"
          test "$(sha256sum apps/desktop/src/state.rs | awk '{print $1}')" = "$BASE_STATE_SHA256"
          test "$(sha256sum "$PATCH" | awk '{print $1}')" = "$PATCH_SHA256"

          git apply --check "$PATCH"
          git apply "$PATCH"
          git diff --check
          test "$(git diff --name-only)" = 'apps/desktop/src/ui.rs'
          test "$(sha256sum apps/desktop/src/ui.rs | awk '{print $1}')" = "$FINAL_UI_SHA256"
          test "$(sha256sum apps/desktop/src/state.rs | awk '{print $1}')" = "$BASE_STATE_SHA256"

          test "$(grep -Fxc '    for destination in NavigationDestination::ALL {' apps/desktop/src/ui.rs)" = '1'
          test "$(grep -Fxc '    stack.set_visible_child_name(NavigationDestination::Overview.stack_name());' apps/desktop/src/ui.rs)" = '1'
          test "$(grep -Fc 'set_visible_child_name' apps/desktop/src/ui.rs)" = '1'
          test "$(grep -Fc 'NavigationDestination::Sessions => placeholder_page(PlaceholderDestination::Sessions)' apps/desktop/src/ui.rs)" = '1'
          test "$(grep -Fc 'NavigationDestination::Transfers => placeholder_page(PlaceholderDestination::Transfers)' apps/desktop/src/ui.rs)" = '1'
          test "$(grep -Fc 'stack.add_titled(&page, Some(destination.stack_name()), destination.title());' apps/desktop/src/ui.rs)" = '1'

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config protobuf-compiler libgtk-4-dev libadwaita-1-dev

      - name: Focused default navigation presentation test
        run: cargo test --locked -p prw-desktop overview_is_the_deterministic_default_destination -- --nocapture

      - name: Formatting check
        run: cargo fmt --check

      - name: Desktop tests
        run: cargo test --locked -p prw-desktop

      - name: Desktop compile check
        run: cargo check --locked -p prw-desktop

      - name: Desktop Clippy
        run: cargo clippy --locked -p prw-desktop --all-targets -- -D warnings
