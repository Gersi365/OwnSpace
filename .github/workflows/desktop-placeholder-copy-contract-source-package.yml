name: Ownspace desktop placeholder copy contract source package

on:
  push:
    branches:
      - "promotion/desktop-placeholder-copy-contract-r1"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout packaging carrier
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify validated source input
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BASE=9e986a1ede30b845ab23921e330452f367d0bb2d
          EXPECTED_UI_BLOB=b5c290b1be135f71a07d03756162de7fbae15c54
          git cat-file -e "$EXPECTED_BASE^{commit}"
          git merge-base --is-ancestor "$EXPECTED_BASE" HEAD
          test "$(git rev-parse HEAD:apps/desktop/src/ui.rs)" = "$EXPECTED_UI_BLOB"
          mapfile -t changed < <(git diff --name-only "$EXPECTED_BASE" HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" = "2"
          test "${changed[0]}" = ".github/workflows/desktop-placeholder-copy-contract-source-package.yml"
          test "${changed[1]}" = "apps/desktop/src/ui.rs"
          echo "EXPECTED_BASE=$EXPECTED_BASE" >> "$GITHUB_ENV"
          echo "EXPECTED_UI_BLOB=$EXPECTED_UI_BLOB" >> "$GITHUB_ENV"

      - name: Construct source-only candidate
        shell: bash
        run: |
          set -euo pipefail
          export GIT_INDEX_FILE="$RUNNER_TEMP/ownspace-placeholder-copy-contract.index"
          rm -f "$GIT_INDEX_FILE"
          git read-tree "$EXPECTED_BASE^{tree}"
          UI_MODE="$(git ls-tree "$EXPECTED_BASE" -- apps/desktop/src/ui.rs | awk '{print $1}')"
          test "$UI_MODE" = "100644"
          git update-index --add --cacheinfo "$UI_MODE" "$EXPECTED_UI_BLOB" apps/desktop/src/ui.rs
          TREE_SHA="$(git write-tree)"
          test "$(git ls-tree -r --name-only "$TREE_SHA" | wc -l | tr -d ' ')" = "372"
          mkdir -p source package-output
          git archive "$TREE_SHA" | tar -x -C source
          test "$(find source -type f | wc -l | tr -d ' ')" = "372"
          cp source/apps/desktop/src/ui.rs package-output/ui.rs
          (
            cd source
            find . -type f -print0 | sort -z | xargs -0 sha256sum
          ) > package-output/OWNSPACE_SOURCE_MANIFEST_SHA256.txt
          (
            cd source
            tar --sort=name --mtime='2026-09-25 00:00:00 UTC' --owner=0 --group=0 --numeric-owner --format=gnu -cf - . | gzip -n -6
          ) > package-output/Ownspace_Source_Current_2026-09-25.tar.gz
          {
            echo "OWNSPACE DESKTOP PLACEHOLDER COPY CONTRACT SOURCE PACKAGE"
            echo "BASE_MAIN=$EXPECTED_BASE"
            echo "VALIDATED_CARRIER_HEAD=ba47f6dcce1582b35bce704ce74c8f288ce71050"
            echo "VALIDATED_SOURCE_COMMIT=d6269e6c35f1feb28bdb91b03bbd13fb45526d31"
            echo "SOURCE_TREE=$TREE_SHA"
            echo "SOURCE_FILES=372"
            echo "UI_BLOB=$EXPECTED_UI_BLOB"
            echo "UI_SHA256=$(sha256sum package-output/ui.rs | awk '{print $1}')"
            echo "MANIFEST_SHA256=$(sha256sum package-output/OWNSPACE_SOURCE_MANIFEST_SHA256.txt | awk '{print $1}')"
            echo "ARCHIVE_SHA256=$(sha256sum package-output/Ownspace_Source_Current_2026-09-25.tar.gz | awk '{print $1}')"
            echo "ARCHIVE_BYTES=$(wc -c < package-output/Ownspace_Source_Current_2026-09-25.tar.gz | tr -d ' ')"
          } > package-output/package-info.txt
          cat package-output/package-info.txt

      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: ownspace-desktop-placeholder-copy-contract-source-package
          path: package-output/
          if-no-files-found: error
          retention-days: 14
