name: Ownspace Desktop Files FileStat read-only R1 validation
on:
  push:
    branches:
      - validation/desktop-files-filestat-readonly-2026-10-01-r1
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BASE_SHA: 437b44286216e89a3bd19573f551f2774ecfeef9
      BASE_TREE: b79101ffd52b2717ae961eebf8fc5fe73413148d
      BRANCH: validation/desktop-files-filestat-readonly-2026-10-01-r1
      PATCH: validation/desktop-files-filestat-readonly-2026-10-01-r1.patch
      WORKFLOW: .github/workflows/validate-desktop-files-filestat-readonly-2026-10-01-r1.yml
    steps:
      - name: Checkout isolated validation carrier
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact baseline, carrier, patch and bounded resulting files
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$BRANCH"
          test "$(git merge-base "$BASE_SHA" HEAD)" = "$BASE_SHA"
          test "$(git rev-list --count "$BASE_SHA"..HEAD)" -eq 2
          test "$(git rev-parse "$BASE_SHA^{tree}")" = "$BASE_TREE"
          mapfile -t committed < <(git diff --name-only "$BASE_SHA"...HEAD | sort)
          test "${#committed[@]}" -eq 2
          test "${committed[0]}" = "$WORKFLOW"
          test "${committed[1]}" = "$PATCH"
          git diff --check "$BASE_SHA"...HEAD
          echo 'c82d8a8f225b196b9d5d8156f16a28cf680a00aaa68d95485bab194f448894e6  validation/desktop-files-filestat-readonly-2026-10-01-r1.patch' | sha256sum -c -
          git apply --check "$PATCH"
          git apply "$PATCH"
          git diff --check
          mapfile -t affected < <(git diff --name-only | sort)
          test "${#affected[@]}" -eq 4
          test "${affected[0]}" = apps/desktop/README.md
          test "${affected[1]}" = apps/desktop/src/ipc.rs
          test "${affected[2]}" = apps/desktop/src/local_management_ipc.rs
          test "${affected[3]}" = apps/desktop/src/ui.rs
          cat > "$RUNNER_TEMP/filestat-candidate.sha256" <<'EOF'
          2527185e830d9f93e904b9647e12714331120c2a73d57ce92e573fbeac2367e0  apps/desktop/README.md
          d1f9a9e4d4973cee0e956aedd78e87db016aa6bbb0e453af5742c4f68ba59592  apps/desktop/src/ipc.rs
          c7794834c6daf8a203349715b594625b19c0ef29cd0a71b75b868e9d8a1b348f  apps/desktop/src/local_management_ipc.rs
          45170145439c0d2175173236aeffbbbd60d3a09676cd5be6b7c3de11201489ff  apps/desktop/src/ui.rs
          EOF
          sha256sum -c "$RUNNER_TEMP/filestat-candidate.sha256"
          test "$(grep -c 'FILE_STAT_REQUEST_ID: u64 = 14' apps/desktop/src/ipc.rs)" -eq 1
          ! git diff -U0 -- crates/prw-agent crates/prw-file-service crates/prw-file-transfer crates/prw-remote-bridge | grep '^+[^+]' 
      - name: Install native validation dependencies and exact Rust
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config protobuf-compiler libgtk-4-dev libadwaita-1-dev
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1
          rustc --version
          pkg-config --modversion gtk4
          pkg-config --modversion libadwaita-1
      - name: Locked Cargo metadata
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Focused FileStat Desktop tests
        run: cargo test --locked -p prw-desktop file_stat_
      - name: Full Desktop tests
        run: cargo test --locked -p prw-desktop
      - name: Desktop all-target compile
        run: cargo check --locked -p prw-desktop --all-targets
      - name: Desktop Clippy deny warnings
        run: cargo clippy --locked -p prw-desktop --all-targets -- -D warnings
      - name: Desktop validation-only release build
        run: cargo build --locked --release -p prw-desktop --bin prw-desktop
      - name: Retain exact candidate validation inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/filestat-r1-inputs"
          cp "$PATCH" "$RUNNER_TEMP/filestat-r1-inputs/"
          cp "$RUNNER_TEMP/filestat-candidate.sha256" "$RUNNER_TEMP/filestat-r1-inputs/"
          printf 'intended_use=validation\nbase=%s\ncarrier=%s\npatch_sha256=%s\npackaging_executed=no\ndeployment_executed=no\n' "$BASE_SHA" "$GITHUB_SHA" c82d8a8f225b196b9d5d8156f16a28cf680a00aaa68d95485bab194f448894e6 > "$RUNNER_TEMP/filestat-r1-inputs/IDENTITY.txt"
      - name: Upload FileStat validation inputs
        uses: actions/upload-artifact@v4
        with:
          name: Ownspace_Desktop_FileStat_Read_Only_R1_${{ github.run_id }}
          path: ${{ runner.temp }}/filestat-r1-inputs
          if-no-files-found: error
          retention-days: 7
