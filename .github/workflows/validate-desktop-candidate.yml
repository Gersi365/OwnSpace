name: Ownspace desktop candidate validation

on:
  push:
    branches:
      - validation/settings-local-ipc-protocol-2026-09-25

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev pkg-config protobuf-compiler
      - name: Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1
      - name: Format
        run: cargo fmt --all -- --check
      - name: Test desktop
        run: cargo test -p prw-desktop
      - name: Clippy desktop
        run: cargo clippy -p prw-desktop --all-targets -- -D warnings
      - name: Build desktop
        run: cargo build -p prw-desktop
      - name: Test workspace
        run: cargo test --workspace
      - name: Clippy workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build workspace
        run: cargo build --workspace
