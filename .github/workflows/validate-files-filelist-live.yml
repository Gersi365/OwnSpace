name: Ownspace Files FileList live validation

on:
  push:
    branches:
      - validation/files-filelist-live-fmt-2026-09-26

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout validation carrier
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify carrier and exact candidate
        shell: bash
        run: |
          set -euo pipefail
          BASE=6aa9dd82f46ee14e6a0f4981c0fee15c0c59b2d2
          BASE_PATCH=.github/validation/files-filelist-live-fmt-2026-09-26.patch
          TEST_PATCH=.github/validation/files-filelist-live-test-fix-2026-09-26.patch
          RUNTIME_TEST_PATCH=.github/validation/files-filelist-live-runtime-orchestration-test-fix-2026-09-26.patch
          CLIPPY_PATCH=.github/validation/files-filelist-live-clippy-fix-2026-09-26.patch
          DESKTOP_CLIPPY_PATCH=.github/validation/files-filelist-live-desktop-clippy-fix-2026-09-26.patch
          test "$(git merge-base HEAD "$BASE")" = "$BASE"
          test "$(git rev-list --count "$BASE"..HEAD)" = "7"
          mapfile -t carrier_files < <(git diff --name-only "$BASE"..HEAD | sort)
          expected_carrier=(
            .github/validation/files-filelist-live-clippy-fix-2026-09-26.patch
            .github/validation/files-filelist-live-desktop-clippy-fix-2026-09-26.patch
            .github/validation/files-filelist-live-fmt-2026-09-26.patch
            .github/validation/files-filelist-live-runtime-orchestration-test-fix-2026-09-26.patch
            .github/validation/files-filelist-live-test-fix-2026-09-26.patch
            .github/workflows/validate-files-filelist-live.yml
          )
          test "${carrier_files[*]}" = "${expected_carrier[*]}"
          echo '93ecc99a8a79ed34e8f21263f57178757e0e082b4fd45432ede0ad4f9f4cf700  crates/prw-agent/src/local_commands/management_agent_status_runtime.rs' | sha256sum --check
          echo '70d71670b3b6b83966efdbfdd9416a2a8f3e7867f37780480f1ec3d149e01a94  crates/prw-agent/src/local_commands/management_agent_status_boundary.rs' | sha256sum --check
          echo 'f46f9b3ba8027383b7e841e38d7d3013f690df82051d290aa4470fc9da6bcbc0  apps/desktop/src/local_management_ipc.rs' | sha256sum --check
          echo '628628cc5bbcbbec56ec6d46ce0d75f713a5191d711aa434eb4b360d89f671d2  apps/desktop/src/ipc.rs' | sha256sum --check
          echo '55f9f5db1f0751730593c278993adcb47d49e014db8e9e32659b28f6d6fa57b3  apps/desktop/src/ui.rs' | sha256sum --check
          echo '6c52983547a706788d3f3e78590d0da2ccc55b665606045c659652d55e6d9033  crates/prw-agent/src/linux_signal_aware_runtime.rs' | sha256sum --check
          echo 'c43d3a5998b0f493afa0903e5f1ec5f9a08d873c9ab75403980aa6031be72b6b  crates/prw-agent/src/linux_runtime_orchestration.rs' | sha256sum --check
          echo 'abf98da4e788e8147e19f426f943cc26bbc68a2c0a3f06d94c23695a910e2f5f  .github/validation/files-filelist-live-fmt-2026-09-26.patch' | sha256sum --check
          echo 'beb80e893ab40fbbc9c3ea7992fddff4dd43e2631bb3b0c2bb0274386d91bb38  .github/validation/files-filelist-live-test-fix-2026-09-26.patch' | sha256sum --check
          echo 'f6e434d2b77d3f9afdb32ac24115da6bb5589911480f4c2921038d260021fdc7  .github/validation/files-filelist-live-runtime-orchestration-test-fix-2026-09-26.patch' | sha256sum --check
          echo '33234c608385af7565667425facaeee89064606e627b618e3ba53bebcbc057ca  .github/validation/files-filelist-live-clippy-fix-2026-09-26.patch' | sha256sum --check
          echo '2511811e7dd4c59c7e1f7c92d2cb2d52772df8085f7a84d54bebe7e67548711c  .github/validation/files-filelist-live-desktop-clippy-fix-2026-09-26.patch' | sha256sum --check
          git apply --check "$BASE_PATCH"
          git apply "$BASE_PATCH"
          git apply --check "$TEST_PATCH"
          git apply "$TEST_PATCH"
          git apply --check "$RUNTIME_TEST_PATCH"
          git apply "$RUNTIME_TEST_PATCH"
          git apply --check "$CLIPPY_PATCH"
          git apply "$CLIPPY_PATCH"
          git apply --check "$DESKTOP_CLIPPY_PATCH"
          git apply "$DESKTOP_CLIPPY_PATCH"
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          expected_changed=(
            apps/desktop/src/ipc.rs
            apps/desktop/src/local_management_ipc.rs
            apps/desktop/src/ui.rs
            crates/prw-agent/src/linux_runtime_orchestration.rs
            crates/prw-agent/src/linux_signal_aware_runtime.rs
            crates/prw-agent/src/local_commands/management_agent_status_boundary.rs
            crates/prw-agent/src/local_commands/management_agent_status_runtime.rs
          )
          test "${changed[*]}" = "${expected_changed[*]}"
          echo '46aa36c73d01d9af174aa1ce8fd2eb7dcaa02ea52efcd3407e54e8b5f3dcac92  crates/prw-agent/src/local_commands/management_agent_status_runtime.rs' | sha256sum --check
          echo '088a1f0c74db6f38efaa01e7246a4dd67f7289c8cd932a580137c581d08a583e  crates/prw-agent/src/local_commands/management_agent_status_boundary.rs' | sha256sum --check
          echo '474e8ca733a319ba4886e8ed20cab7b6edc7c9225f220be63e40325c85fb5470  apps/desktop/src/local_management_ipc.rs' | sha256sum --check
          echo '4ec37bebda600f75919964fb500b61843f637c4092f9f65a4e6c82ceaae796d4  apps/desktop/src/ipc.rs' | sha256sum --check
          echo '1e78ab29681ff437e3aa2b3f2a2f632e1c66c441cf24288f0bce72e79e64c95e  apps/desktop/src/ui.rs' | sha256sum --check
          echo 'a2753824f864c25156569556f60ebf372ff8a8013ffab9dae73276765aa3af3d  crates/prw-agent/src/linux_signal_aware_runtime.rs' | sha256sum --check
          echo '8cd8eae5e5cc6e2adefe8f5f0ee3291e84c31c94d95bb95170565d401e67dd02  crates/prw-agent/src/linux_runtime_orchestration.rs' | sha256sum --check

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config protobuf-compiler libgtk-4-dev libadwaita-1-dev

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Formatting check
        run: cargo fmt --all -- --check

      - name: Agent and desktop compile check
        run: cargo check --locked -p prw-agent -p prw-desktop --all-targets

      - name: Agent and desktop tests
        run: cargo test --locked -p prw-agent -p prw-desktop --all-targets

      - name: Agent and desktop Clippy
        run: cargo clippy --locked -p prw-agent -p prw-desktop --all-targets -- -D warnings
