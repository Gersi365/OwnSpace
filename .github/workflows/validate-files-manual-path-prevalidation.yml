name: Ownspace Files manual-path prevalidation

on:
  push:
    branches:
      - validation/files-manual-path-prevalidation-2026-09-27
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout carrier
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install desktop system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config protobuf-compiler libgtk-4-dev libadwaita-1-dev

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1

      - name: Verify carrier and exact candidate
        shell: bash
        run: |
          set -euo pipefail
          BASE=8f36454bc619cddce1448de35f9490ba94f01e5b
          PATCH=.github/validation/OWNSPACE_FILES_MANUAL_PATH_PREVALIDATION_CANDIDATE_2026-09-27.patch
          WORKFLOW=.github/workflows/validate-files-manual-path-prevalidation.yml

          test "$(git merge-base HEAD "$BASE")" = "$BASE"

          mapfile -t carrier_files < <(git diff --name-only "$BASE"..HEAD | sort)
          expected_carrier=("$PATCH" "$WORKFLOW")
          mapfile -t expected_sorted < <(printf '%s\n' "${expected_carrier[@]}" | sort)
          test "${carrier_files[*]}" = "${expected_sorted[*]}"

          echo 'f14b51e80e72ea05ba5aca8d85bbe5a091bcfba200d1895917086ec799e6d629  '"$PATCH" | sha256sum -c -
          echo '6740a43ec2825fd5b3b191b8ae46ad005e7a46575c4221b0058a2346d929d399  apps/desktop/src/ui.rs' | sha256sum -c -
          echo '7ff6f71af20d1c66bff1cd8724c4ab5cc2f581c70147781d8e35ffbbe961eb0f  apps/desktop/src/local_management_ipc.rs' | sha256sum -c -
          echo '4ec37bebda600f75919964fb500b61843f637c4092f9f65a4e6c82ceaae796d4  apps/desktop/src/ipc.rs' | sha256sum -c -

          git apply --check "$PATCH"
          git apply "$PATCH"
          git diff --check

          test "$(git diff --name-only)" = "apps/desktop/src/ui.rs"
          echo '5d968bde2afbf6839fdc7891a244b5c0823cfaae2918bd4f3e5b66d21a5ca53c  apps/desktop/src/ui.rs' | sha256sum -c -
          echo '7ff6f71af20d1c66bff1cd8724c4ab5cc2f581c70147781d8e35ffbbe961eb0f  apps/desktop/src/local_management_ipc.rs' | sha256sum -c -
          echo '4ec37bebda600f75919964fb500b61843f637c4092f9f65a4e6c82ceaae796d4  apps/desktop/src/ipc.rs' | sha256sum -c -

      - name: Formatting check
        run: cargo fmt --check

      - name: Desktop tests
        run: cargo test --locked -p prw-desktop

      - name: Desktop compile check
        run: cargo check --locked -p prw-desktop

      - name: Desktop Clippy
        run: cargo clippy --locked -p prw-desktop --all-targets -- -D warnings
