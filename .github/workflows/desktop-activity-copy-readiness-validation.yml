name: Ownspace desktop activity copy readiness validation

on:
  push:
    branches:
      - "validation/desktop-activity-copy-readiness-r1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify candidate scope
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BASE=56bb82f75524f3f64941917df09cdcdf1c3aa9eb
          EXPECTED_UI_BLOB=11c3648e3d5a35461b4f8bacb4b976b6021484fb
          EXPECTED_README_BLOB=aef5a0cd703f136917a7d6e536f3016544bb7657
          git cat-file -e "$EXPECTED_BASE^{commit}"
          git merge-base --is-ancestor "$EXPECTED_BASE" HEAD
          test "$(git rev-parse HEAD:apps/desktop/src/ui.rs)" = "$EXPECTED_UI_BLOB"
          test "$(git rev-parse HEAD:apps/desktop/README.md)" = "$EXPECTED_README_BLOB"
          mapfile -t changed < <(git diff --name-only "$EXPECTED_BASE" HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" = "3"
          test "${changed[0]}" = ".github/workflows/desktop-activity-copy-readiness-validation.yml"
          test "${changed[1]}" = "apps/desktop/README.md"
          test "${changed[2]}" = "apps/desktop/src/ui.rs"
          grep -Fq 'const fn activity_snapshot_copy_available' apps/desktop/src/ui.rs
          grep -Fq '.set_sensitive(activity_snapshot_copy_available(state.availability));' apps/desktop/src/ui.rs
          grep -Fq 'AgentAvailability::Connecting' apps/desktop/src/ui.rs
          test "$(grep -Fc 'ipc::query_startup()' apps/desktop/src/ui.rs)" = "1"
          grep -Fq 'disabled during the synthetic initial `Connecting` projection' apps/desktop/README.md
          mkdir -p validation-output
          {
            echo "OWNSPACE DESKTOP ACTIVITY COPY READINESS VALIDATION"
            echo "BASE_COMMIT=$EXPECTED_BASE"
            echo "EXPECTED_UI_BLOB=$EXPECTED_UI_BLOB"
            echo "EXPECTED_README_BLOB=$EXPECTED_README_BLOB"
            echo "CANDIDATE_COMMIT=$(git rev-parse HEAD)"
            echo "CHANGED_SOURCE_PATHS=2"
            echo "IPC_QUERY_STARTUP_CALL_SITES=1"
          } > validation-output/desktop-activity-copy-readiness.txt

      - name: Install native build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates clang cmake desktop-file-utils libadwaita-1-dev libgtk-4-dev \
            libssl-dev ninja-build perl pkg-config protobuf-compiler

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1

      - name: Focused desktop checks
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.97.1 fmt --all -- --check
          cargo +1.97.1 test --locked -p prw-desktop

      - name: Workspace validation
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.97.1 metadata --locked --no-deps --format-version 1 >/dev/null
          cargo +1.97.1 clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo +1.97.1 test --locked --workspace --all-targets
          cargo +1.97.1 build --locked --workspace --all-targets
          {
            echo "FOCUSED_DESKTOP=PASS"
            echo "CARGO_METADATA=PASS"
            echo "CARGO_FMT=PASS"
            echo "CARGO_CLIPPY=PASS"
            echo "CARGO_TEST=PASS"
            echo "CARGO_BUILD=PASS"
            echo "RESULT=PASS"
          } >> validation-output/desktop-activity-copy-readiness.txt

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ownspace-desktop-activity-copy-readiness-validation
          path: validation-output/
          if-no-files-found: warn
          retention-days: 14
