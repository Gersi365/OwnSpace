name: Ownspace Files unloaded-current-path presentation validation

on:
  push:
    branches:
      - validation/files-unloaded-current-path-presentation-scope-fix-2026-09-27

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation carrier
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify exact carrier and candidate
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA='a94d8b234a7f2baabcfd028ed9764c3f1af69600'
          BASE_UI_SHA256='2c044e753b947d15ccd3d0b7eb7d1738723920fe474df477ef69d9a51609e86f'
          PATCH_SHA256='b81c8f320f94bd282b692c0c642f385afbe27b63b443fd8ad35db9e7487478cb'
          CANDIDATE_UI_SHA256='94d68636770df70d9ee721f7ec5de04c6039d17e8e722b7873e7296ced57c951'
          PATCH='.github/validation/OWNSPACE_FILES_UNLOADED_CURRENT_PATH_PRESENTATION_CANDIDATE_2026-09-27.patch'
          WORKFLOW='.github/workflows/validate-files-unloaded-current-path-presentation.yml'

          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          mapfile -t carrier_files < <(git diff --name-only "$BASE_SHA"..HEAD | sort)
          expected_carrier=("$PATCH" "$WORKFLOW")
          mapfile -t expected_sorted < <(printf '%s\n' "${expected_carrier[@]}" | sort)
          test "${carrier_files[*]}" = "${expected_sorted[*]}"

          test "$(sha256sum apps/desktop/src/ui.rs | awk '{print $1}')" = "$BASE_UI_SHA256"
          test "$(sha256sum "$PATCH" | awk '{print $1}')" = "$PATCH_SHA256"

          git apply --check "$PATCH"
          git apply "$PATCH"
          git diff --check
          test "$(git diff --name-only)" = 'apps/desktop/src/ui.rs'
          test "$(sha256sum apps/desktop/src/ui.rs | awk '{print $1}')" = "$CANDIDATE_UI_SHA256"

          grep -Fq 'const FILES_PATH_UNLOADED_LABEL: &str = "Current path: not loaded";' apps/desktop/src/ui.rs
          grep -Fq 'let current_path_label = gtk::Label::new(Some(FILES_PATH_UNLOADED_LABEL));' apps/desktop/src/ui.rs
          grep -Fq 'super::file_list_path_label("")' apps/desktop/src/ui.rs
          grep -Fq '"Current path: docs/reports"' apps/desktop/src/ui.rs

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config protobuf-compiler libgtk-4-dev libadwaita-1-dev

      - name: Formatting check
        run: cargo fmt --check

      - name: Focused presentation test
        run: cargo test --locked -p prw-desktop files_path_labels_distinguish_unloaded_from_committed_paths -- --nocapture

      - name: Desktop tests
        run: cargo test --locked -p prw-desktop

      - name: Desktop compile check
        run: cargo check --locked -p prw-desktop

      - name: Desktop Clippy
        run: cargo clippy --locked -p prw-desktop --all-targets -- -D warnings
