name: Ownspace desktop Activity endpoint snapshot validation R2

on:
  push:
    branches:
      - validation/desktop-activity-endpoint-snapshot-r2-2026-09-26

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3

      - name: Verify validation carrier
        shell: bash
        run: |
          set -euo pipefail
          expected_base='6195a3967e2575e7cf42a0a4f47bb92c3d2076f9'
          test "$(git merge-base "$expected_base" HEAD)" = "$expected_base"
          test "$(git rev-list --count "$expected_base"..HEAD)" = '2'

          expected_files="$(printf '%s\n' \
            '.github/validation/desktop-activity-endpoint-snapshot-format-fix-2026-09-26.patch' \
            '.github/workflows/validate-desktop-activity-endpoint-snapshot-r2.yml' | sort)"
          actual_files="$(git diff --name-only "$expected_base" HEAD | sort)"
          test "$actual_files" = "$expected_files"

      - name: Verify authoritative base and reconstruct exact R2 candidate
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            'aa1ee9c4b61912e0a7a3c291269491780d4944c0fa197d17c75e5f135aba6941' 'apps/desktop/src/state.rs' \
            '68e7915dca870942bfe007e01187d9255515bcbbe29d18f5c39f9ef45b0b0afa' 'apps/desktop/src/ui.rs' \
            '703cdae3956906ae74eab30730badb4838d489d1ebe507b345a0d4bcc7f42455' 'apps/desktop/README.md' \
            '628628cc5bbcbbec56ec6d46ce0d75f713a5191d711aa434eb4b360d89f671d2' 'apps/desktop/src/ipc.rs' \
            | sha256sum -c -

          printf '%s  %s\n' \
            'b75b1cb820cd8306ee7221e7796e1dc5d252b7bc583a41268c3fe725104a85c0' \
            '.github/validation/desktop-activity-endpoint-snapshot-format-fix-2026-09-26.patch' \
            | sha256sum -c -

          git fetch --no-tags --depth=1 origin \
            refs/heads/validation/desktop-activity-endpoint-snapshot-2026-09-26:refs/remotes/origin/activity-endpoint-r1
          git show refs/remotes/origin/activity-endpoint-r1:.github/validation/desktop-activity-endpoint-snapshot-2026-09-26.patch > /tmp/activity-endpoint-r1.patch
          printf '%s  %s\n' \
            'cbc605b3b230d6fa00a23564eba81966f6d3b29131759fe988878fcaf08b8ea6' \
            '/tmp/activity-endpoint-r1.patch' \
            | sha256sum -c -

          git apply --check /tmp/activity-endpoint-r1.patch
          git apply /tmp/activity-endpoint-r1.patch
          git apply --check .github/validation/desktop-activity-endpoint-snapshot-format-fix-2026-09-26.patch
          git apply .github/validation/desktop-activity-endpoint-snapshot-format-fix-2026-09-26.patch

          printf '%s  %s\n' \
            'aa1ee9c4b61912e0a7a3c291269491780d4944c0fa197d17c75e5f135aba6941' 'apps/desktop/src/state.rs' \
            '9140b4d6978817d4ffa625b164ea6cb651fc4b6edbacd8898c7c72aaca18bb08' 'apps/desktop/src/ui.rs' \
            '2df52ec4ca7ffc06c54a30cbaf41b999fb88228d970b9e5a3db8d55d837a8e11' 'apps/desktop/README.md' \
            '628628cc5bbcbbec56ec6d46ce0d75f713a5191d711aa434eb4b360d89f671d2' 'apps/desktop/src/ipc.rs' \
            | sha256sum -c -

      - name: Install GTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev pkg-config protobuf-compiler

      - name: Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1

      - name: Format
        run: cargo fmt --all -- --check

      - name: Test desktop
        run: cargo test -p prw-desktop

      - name: Clippy desktop
        run: cargo clippy -p prw-desktop --all-targets -- -D warnings

      - name: Build desktop
        run: cargo build -p prw-desktop

      - name: Test workspace
        run: cargo test --workspace

      - name: Clippy workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build workspace
        run: cargo build --workspace
