name: Ownspace bounded upload Agent runtime validation R6

on:
  push:
    branches:
      - validation/desktop-transfers-bounded-upload-2026-09-29-r6

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout carrier
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify isolated R6 carrier
        shell: bash
        run: |
          set -euo pipefail
          base=42ca051422d6f21fc499db2b392f12bfed736733
          delta=.github/validation/OWNSPACE_AGENT_BOUNDED_UPLOAD_RUNTIME_R6_CLIPPY_DELTA_2026-09-29.patch
          test "$(git merge-base HEAD "$base")" = "$base"
          mapfile -t carrier_changed < <(git diff --name-only "$base"..HEAD)
          expected_carrier=(
            .github/validation/OWNSPACE_AGENT_BOUNDED_UPLOAD_RUNTIME_R6_CLIPPY_DELTA_2026-09-29.patch
            .github/workflows/validate-desktop-transfers-bounded-upload-r6-2026-09-29.yml
          )
          test "${#carrier_changed[@]}" -eq "${#expected_carrier[@]}"
          for i in "${!expected_carrier[@]}"; do
            test "${carrier_changed[$i]}" = "${expected_carrier[$i]}"
          done
          test "$(sha256sum "$delta" | awk '{print $1}')" = "caa59802945d730f308d4129afb8835a8906772cd7b91697b80bf3d8c11e24cc"
          test "$(wc -c < "$delta")" = "7382"

      - name: Recover exact R2 and R5 carriers
        shell: bash
        run: |
          set -euo pipefail
          r2=7a36773800f58c37f31ec81995d30d039eb5f079
          r5=e318a4303838a16f700345eae1b1917b5d79a22f
          git cat-file -e "$r2^{commit}"
          git cat-file -e "$r5^{commit}"
          git show "$r2:.github/validation/OWNSPACE_AGENT_BOUNDED_UPLOAD_RUNTIME_CANDIDATE_R2_2026-09-29.patch" > /tmp/r2.patch
          test "$(sha256sum /tmp/r2.patch | awk '{print $1}')" = "7d334b99b0dbaf7e8b50134f6780d0191fe4bf7afa88a427fc6021047687b172"
          test "$(wc -c < /tmp/r2.patch)" = "56134"
          git show "$r5:.github/validation/OWNSPACE_AGENT_BOUNDED_UPLOAD_RUNTIME_R5_TEST_EXPECTATION_DELTA_2026-09-29.patch" > /tmp/r5-transport.patch
          test "$(sha256sum /tmp/r5-transport.patch | awk '{print $1}')" = "fb776b4f64ddae0aa365cfb8236f04e22e745cc712f08d98e63269cfc07478a4"
          test "$(wc -c < /tmp/r5-transport.patch)" = "1727"
          python3 - /tmp/r5-transport.patch /tmp/r5.patch <<'PY'
          import pathlib
          import sys

          source = pathlib.Path(sys.argv[1]).read_bytes()
          if not source.startswith(b"\xef\xbb\xbf"):
              raise SystemExit("R5 delta transport is missing the expected UTF-8 BOM")
          normalized = source[3:].replace(b"\r\n", b"\n")
          if b"\r" in normalized:
              raise SystemExit("R5 delta transport contains an unexpected lone CR")
          if not normalized.endswith(b"\n"):
              normalized += b"\n"
          pathlib.Path(sys.argv[2]).write_bytes(normalized)
          PY
          test "$(sha256sum /tmp/r5.patch | awk '{print $1}')" = "1138037aa7432e252937abfda8a8924f39be0577d861760bd5202565a7b5e0a5"
          test "$(wc -c < /tmp/r5.patch)" = "1694"
          git apply --check /tmp/r2.patch
          git apply /tmp/r2.patch
          git diff --check

      - name: Install exact Rust validation toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config protobuf-compiler
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1
          rustc --version
          cargo --version

      - name: Reconstruct exact R5 and apply exact R6 Clippy delta
        shell: bash
        run: |
          set -euo pipefail
          r6_delta=.github/validation/OWNSPACE_AGENT_BOUNDED_UPLOAD_RUNTIME_R6_CLIPPY_DELTA_2026-09-29.patch

          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          r3_files=(
            crates/prw-agent/src/linux_authenticated_session/management_agent_status.rs
            crates/prw-agent/src/linux_session_worker.rs
            crates/prw-agent/src/linux_session_worker/management_agent_status.rs
            crates/prw-agent/src/local_commands/management_agent_status_boundary.rs
            crates/prw-agent/src/local_commands/management_agent_status_runtime.rs
            crates/prw-agent/src/local_commands/management_authority.rs
            crates/prw-agent/src/local_commands/server_connection_state.rs
          )
          git diff --binary -- "${r3_files[@]}" > /tmp/r3.patch
          test "$(sha256sum /tmp/r3.patch | awk '{print $1}')" = "20b1f6897cbf32eaed9696d96af8f3cdc9c70f8f69eef1645ef3e5e959f5ee98"
          test "$(wc -c < /tmp/r3.patch)" = "55738"

          git apply --check /tmp/r5.patch
          git apply /tmp/r5.patch
          cargo fmt --all -- --check
          git diff --check
          r5_files=(
            crates/prw-agent/src/linux_authenticated_session/management_agent_status.rs
            crates/prw-agent/src/linux_runtime_orchestration.rs
            crates/prw-agent/src/linux_session_worker.rs
            crates/prw-agent/src/linux_session_worker/management_agent_status.rs
            crates/prw-agent/src/linux_signal_aware_runtime.rs
            crates/prw-agent/src/local_commands/management_agent_status_boundary.rs
            crates/prw-agent/src/local_commands/management_agent_status_runtime.rs
            crates/prw-agent/src/local_commands/management_authority.rs
            crates/prw-agent/src/local_commands/server_connection_state.rs
          )
          git diff --binary -- "${r5_files[@]}" > /tmp/r5-combined.patch
          test "$(sha256sum /tmp/r5-combined.patch | awk '{print $1}')" = "675823d24437e310b5b728125c576d1e510f5c23ea04e283758c70e0b24a3439"
          test "$(wc -c < /tmp/r5-combined.patch)" = "57432"

          git apply --check "$r6_delta"
          git apply "$r6_delta"
          cargo fmt --all -- --check
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq "${#r5_files[@]}"
          for i in "${!r5_files[@]}"; do
            test "${changed[$i]}" = "${r5_files[$i]}"
          done

          printf '%s  %s\n' \
            b9036f0d6b28af72e0550356ec62ea8111f48f7ed10149093eadedcbec35d971 crates/prw-agent/src/linux_authenticated_session/management_agent_status.rs \
            758a24374d27b14e923d8aa1ba256cc971637bcb6946f25cc7062d3357423de4 crates/prw-agent/src/linux_runtime_orchestration.rs \
            1b0ff4b9e83f3b032345a88963dbc48aeb1e97d61be9572fc66690848e0e5bc4 crates/prw-agent/src/linux_session_worker.rs \
            a27236ddfda23a4b231b4ebd4acfad3bacd223665920d63abcdf096e9532414a crates/prw-agent/src/linux_session_worker/management_agent_status.rs \
            953a3a4a3dba38e30036a958a7edcc40578bb82463ddf960b356f60cea444ef2 crates/prw-agent/src/linux_signal_aware_runtime.rs \
            1374d474236858fb8932d94e15ce157c606a1691df7ca103331e46bbc9a9aecd crates/prw-agent/src/local_commands/management_agent_status_boundary.rs \
            04749db969a4507fbf82000096df455bab46b08f459d7410a292237770d8027f crates/prw-agent/src/local_commands/management_agent_status_runtime.rs \
            a8627eefefd2ad201e527172801bfca67b5379187d4b6590a6a363a831be4279 crates/prw-agent/src/local_commands/management_authority.rs \
            90c5e7b00db7bb002896e357dd4f35757c3894f1ec8a0d774d03d1f0a8daaaed crates/prw-agent/src/local_commands/server_connection_state.rs \
            | sha256sum -c -

          git diff --binary -- "${r5_files[@]}" > /tmp/r6.patch
          test "$(sha256sum /tmp/r6.patch | awk '{print $1}')" = "8d0d0c1ae7471ac73012b3c38745611a544ea067433f7fc8ce43135d6c254edb"
          test "$(wc -c < /tmp/r6.patch)" = "57325"

      - name: Regression test runtime orchestration file-write closure
        run: cargo test --locked -p prw-agent 'linux_identity::runtime_orchestration::tests::agent_status_worker_selection_denies_file_write_management_command' -- --exact

      - name: Regression test signal-aware file-write closure
        run: cargo test --locked -p prw-agent 'linux_identity::signal_aware_runtime::tests::agent_status_signal_aware_path_denies_file_write_management' -- --exact

      - name: Focused bounded upload tests
        run: cargo test --locked -p prw-agent bounded_upload

      - name: Focused management runtime tests
        run: cargo test --locked -p prw-agent management_agent_status

      - name: Agent library tests
        run: cargo test --locked -p prw-agent --lib

      - name: Agent compile check
        run: cargo check --locked -p prw-agent --all-targets

      - name: Agent Clippy
        run: cargo clippy --locked -p prw-agent --all-targets -- -D warnings

      - name: Agent release binary build
        run: cargo build --locked --release -p prw-agent --bin prw-agent
