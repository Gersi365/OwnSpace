name: Ownspace validation F3

on:
  workflow_dispatch:
  push:
    branches:
      - "validation/**"

permissions:
  contents: read

jobs:
  full-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout validation carrier
        uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            clang \
            cmake \
            desktop-file-utils \
            libadwaita-1-dev \
            libgtk-4-dev \
            libssl-dev \
            ninja-build \
            perl \
            pkg-config \
            protobuf-compiler

      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1
          rustup target add --toolchain 1.97.1 aarch64-linux-android x86_64-linux-android
          rustc --version
          cargo --version
          rustfmt --version
          cargo clippy --version

      - name: Install cargo-ndk
        run: |
          cargo +1.97.1 install cargo-ndk --version 4.1.2 --locked
          cargo ndk --version

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Use runner Android SDK
        run: |
          ANDROID_SDK="/usr/local/lib/android/sdk"
          SDKMANAGER="$(find "$ANDROID_SDK/cmdline-tools" -type f -name sdkmanager -perm -u+x -print -quit)"
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "OWNSPACE_SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      - name: Install Android platform and NDK
        run: |
          yes | "$OWNSPACE_SDKMANAGER" --licenses >/dev/null || true
          "$OWNSPACE_SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "ndk;28.2.13676358"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/ndk/28.2.13676358"

      - name: Verify carrier hashes
        run: |
          echo "6b981dde40d5675620b7030b8b76c28fadfd89121caf0e5845f487ceeaaf87c4  source/Ownspace_Source_Current_2026-09-24.tar.gz" | sha256sum -c -
          echo "b2c137728846635c2f872fd3f2f8b059655505856b1988a5cac92f9268896742  source/OWNSPACE_SOURCE_MANIFEST_SHA256.txt" | sha256sum -c -
          echo "13608ead93378aad8fea2f76b9fd0b63bb8cee5dcf0512a54d4e60b6c8a1fb9f  candidate/OWNSPACE_TEMP_STARTUP_AUTHORITY_V4.patch" | sha256sum -c -
          echo "11eb59d62cfcb9da3057e3debcc10e4d48ff77a5279b30cfb2ee7244ef12c4f0  candidate/OWNSPACE_TEMP_ANDROID_UI_A1.patch" | sha256sum -c -
          echo "40b4655c51cbf33618830c8c2cef73ca2051049e1dd2dba23d3e4b65874deb96  candidate/OWNSPACE_TEMP_DESKTOP_UI_B1.patch" | sha256sum -c -
          echo "27d6b520d6e2e290913f7f86bbb5f0339e9b6735e259f70eea5fcf36ee44243e  candidate/OWNSPACE_TEMP_FORMAT_F1.patch" | sha256sum -c -
          echo "fe9af5847028b9086aa6f24e8b170525f27053f2eff01c69e43677a5c01f6ee9  candidate/OWNSPACE_TEMP_CLIPPY_F2.patch" | sha256sum -c -
          echo "da958bab9e7acb61a5d4a067152f6c9bbe6a4d7dc5285a91b130afac20dc267b  candidate/OWNSPACE_TEMP_CLIPPY_F3.patch" | sha256sum -c -
          echo "775bb380ac78a39f342c7fbe2d91ba351221497bb2e41f07e85e067f10e981bd  candidate/OWNSPACE_TEMP_COMBINED_V4_A1_B1_F3_MANIFEST_SHA256.txt" | sha256sum -c -
          echo "f35257e4816889dfaeec05d48ad65ff2c72d5d11eeb49259a04fcb18be197065  validation/validate_ownspace_android_candidate.sh" | sha256sum -c -
          echo "0fa8a321ce6ef982f3300138da16d6bfede616fa506195cdc5ab94be8d9715ab  validation/validate_ownspace_combined_v4_a1_b1_f3.sh" | sha256sum -c -

      - name: Run exact combined validation
        run: |
          chmod +x validation/*.sh
          validation/validate_ownspace_combined_v4_a1_b1_f3.sh \
            --base-archive source/Ownspace_Source_Current_2026-09-24.tar.gz \
            --base-manifest source/OWNSPACE_SOURCE_MANIFEST_SHA256.txt \
            --v4-patch candidate/OWNSPACE_TEMP_STARTUP_AUTHORITY_V4.patch \
            --a1-patch candidate/OWNSPACE_TEMP_ANDROID_UI_A1.patch \
            --b1-patch candidate/OWNSPACE_TEMP_DESKTOP_UI_B1.patch \
            --f1-patch candidate/OWNSPACE_TEMP_FORMAT_F1.patch \
            --f2-patch candidate/OWNSPACE_TEMP_CLIPPY_F2.patch \
            --f3-patch candidate/OWNSPACE_TEMP_CLIPPY_F3.patch \
            --combined-manifest candidate/OWNSPACE_TEMP_COMBINED_V4_A1_B1_F3_MANIFEST_SHA256.txt \
            --android-runner validation/validate_ownspace_android_candidate.sh \
            --output validation-output \
            --mode full

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ownspace-validation-reports
          path: validation-output/
          if-no-files-found: warn
          retention-days: 14
