name: Ownspace desktop settings resolved endpoint validation

on:
  push:
    branches:
      - "validation/desktop-settings-resolved-endpoint-r1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify candidate scope
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BASE=4b763eed978086e110a924e519b4ea32b80aacf2
          EXPECTED_IPC_BLOB=b1e76c47c12014f578d7ade1407a46fe5f62d111
          EXPECTED_UI_BLOB=2b0213647490cf45075b3fc23084b8df86526df3
          EXPECTED_README_BLOB=a4bd9e9833ed4ac0614f878fde17cd9187536ad9
          git cat-file -e "$EXPECTED_BASE^{commit}"
          git merge-base --is-ancestor "$EXPECTED_BASE" HEAD
          test "$(git rev-parse HEAD:apps/desktop/src/ipc.rs)" = "$EXPECTED_IPC_BLOB"
          test "$(git rev-parse HEAD:apps/desktop/src/ui.rs)" = "$EXPECTED_UI_BLOB"
          test "$(git rev-parse HEAD:apps/desktop/README.md)" = "$EXPECTED_README_BLOB"
          mapfile -t changed < <(git diff --name-only "$EXPECTED_BASE" HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" = "4"
          test "${changed[0]}" = ".github/workflows/desktop-settings-resolved-endpoint-validation.yml"
          test "${changed[1]}" = "apps/desktop/README.md"
          test "${changed[2]}" = "apps/desktop/src/ipc.rs"
          test "${changed[3]}" = "apps/desktop/src/ui.rs"
          grep -Fq 'endpoint_candidate_from_environment' apps/desktop/src/ipc.rs
          grep -Fq 'Resolved endpoint for this session' apps/desktop/src/ui.rs
          grep -Fq 'session-resolved candidate endpoint' apps/desktop/README.md
          mkdir -p validation-output
          {
            echo "OWNSPACE DESKTOP SETTINGS RESOLVED ENDPOINT VALIDATION"
            echo "BASE_COMMIT=$EXPECTED_BASE"
            echo "EXPECTED_IPC_BLOB=$EXPECTED_IPC_BLOB"
            echo "EXPECTED_UI_BLOB=$EXPECTED_UI_BLOB"
            echo "EXPECTED_README_BLOB=$EXPECTED_README_BLOB"
            echo "CANDIDATE_COMMIT=$(git rev-parse HEAD)"
            echo "CHANGED_SOURCE_PATHS=3"
          } > validation-output/desktop-settings-resolved-endpoint.txt

      - name: Install native build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             ca-certificates clang cmake desktop-file-utils libadwaita-1-dev libgtk-4-dev             libssl-dev ninja-build perl pkg-config protobuf-compiler

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1

      - name: Focused desktop checks
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.97.1 fmt --all -- --check
          cargo +1.97.1 test --locked -p prw-desktop

      - name: Workspace validation
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.97.1 metadata --locked --no-deps --format-version 1 >/dev/null
          cargo +1.97.1 clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo +1.97.1 test --locked --workspace --all-targets
          cargo +1.97.1 build --locked --workspace --all-targets
          {
            echo "FOCUSED_DESKTOP=PASS"
            echo "CARGO_METADATA=PASS"
            echo "CARGO_FMT=PASS"
            echo "CARGO_CLIPPY=PASS"
            echo "CARGO_TEST=PASS"
            echo "CARGO_BUILD=PASS"
            echo "RESULT=PASS"
          } >> validation-output/desktop-settings-resolved-endpoint.txt

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ownspace-desktop-settings-resolved-endpoint-validation
          path: validation-output/
          if-no-files-found: warn
          retention-days: 14
