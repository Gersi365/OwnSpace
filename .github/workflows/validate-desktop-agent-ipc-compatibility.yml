name: Ownspace desktop Agent IPC compatibility validation

on:
  push:
    branches:
      - validation/desktop-agent-ipc-compatibility-2026-09-26

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify validation carrier
        shell: bash
        run: |
          set -euo pipefail
          expected_parent='5a82d49d566b14ef7f9fe669ccf9a2133c09c202'
          actual_parent="$(git rev-parse HEAD^)"
          test "$actual_parent" = "$expected_parent"

          expected_files="$(printf '%s\n' \
            '.github/validation/desktop-agent-ipc-compatibility-2026-09-26.patch' \
            '.github/workflows/validate-desktop-agent-ipc-compatibility.yml' | sort)"
          actual_files="$(git diff --name-only "$expected_parent" HEAD | sort)"
          test "$actual_files" = "$expected_files"

      - name: Verify authoritative base and apply candidate patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            '30045dde57aaa169eb025cb8f0c497d0e1b8a40844d187b0ce40f44a163de3e6' 'apps/desktop/src/state.rs' \
            'c5099eba254214d6fcc7385ffec3c6c6f994c96ecc506b7f889341a8acffc482' 'apps/desktop/src/ui.rs' \
            '25e637878e1b09bf4637492108024edfff02288e2537dc9648b3bee42c4aee30' 'apps/desktop/README.md' \
            '628628cc5bbcbbec56ec6d46ce0d75f713a5191d711aa434eb4b360d89f671d2' 'apps/desktop/src/ipc.rs' \
            | sha256sum -c -

          printf '%s  %s\n' \
            '165c379c0ce5d390593f73721c06633d6882e68042995d720b2d525dc5d550f5' \
            '.github/validation/desktop-agent-ipc-compatibility-2026-09-26.patch' \
            | sha256sum -c -

          git apply --check .github/validation/desktop-agent-ipc-compatibility-2026-09-26.patch
          git apply .github/validation/desktop-agent-ipc-compatibility-2026-09-26.patch

          printf '%s  %s\n' \
            'e386fd8c5aaae7f5603d60f2b5995194d36015ab96742f6bc9b70685170b079b' 'apps/desktop/src/state.rs' \
            '68e7915dca870942bfe007e01187d9255515bcbbe29d18f5c39f9ef45b0b0afa' 'apps/desktop/src/ui.rs' \
            '6415113acc26699cd7b4380c2c6e30a3f7e1e5a42cb6d383e665b0e48a6f09a2' 'apps/desktop/README.md' \
            '628628cc5bbcbbec56ec6d46ce0d75f713a5191d711aa434eb4b360d89f671d2' 'apps/desktop/src/ipc.rs' \
            | sha256sum -c -

      - name: Install GTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev pkg-config protobuf-compiler

      - name: Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1

      - name: Format
        run: cargo fmt --all -- --check

      - name: Test desktop
        run: cargo test -p prw-desktop

      - name: Clippy desktop
        run: cargo clippy -p prw-desktop --all-targets -- -D warnings

      - name: Build desktop
        run: cargo build -p prw-desktop

      - name: Test workspace
        run: cargo test --workspace

      - name: Clippy workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build workspace
        run: cargo build --workspace
