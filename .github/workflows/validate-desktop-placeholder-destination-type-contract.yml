name: Ownspace Desktop placeholder destination type contract validation

on:
  push:
    branches:
      - validation/desktop-placeholder-destination-type-contract-2026-09-28

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation carrier
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify exact carrier and candidate
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA='4faf67a7d0821e2078d038177b539af26b512149'
          BASE_UI_SHA256='82f86b27bb09037393701e272e20977c4a17b892345d25565f24dfa14cc44d39'
          BASE_STATE_SHA256='aa1ee9c4b61912e0a7a3c291269491780d4944c0fa197d17c75e5f135aba6941'
          PATCH_SHA256='b879838fedee274ea183be2049ddb10e7e13e890fdde531cfcdbb34ced90a3f3'
          FINAL_UI_SHA256='3de6d9b3c3f2352390be99ebeb7cf7961a7b81f489790407cb71d08ca0b14fba'
          PATCH='.github/validation/OWNSPACE_DESKTOP_PLACEHOLDER_DESTINATION_TYPE_CONTRACT_CANDIDATE_2026-09-28.patch'

          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(sha256sum apps/desktop/src/ui.rs | awk '{print $1}')" = "$BASE_UI_SHA256"
          test "$(sha256sum apps/desktop/src/state.rs | awk '{print $1}')" = "$BASE_STATE_SHA256"
          test "$(sha256sum "$PATCH" | awk '{print $1}')" = "$PATCH_SHA256"

          git apply --check "$PATCH"
          git apply "$PATCH"
          git diff --check
          test "$(git diff --name-only)" = 'apps/desktop/src/ui.rs'
          test "$(sha256sum apps/desktop/src/ui.rs | awk '{print $1}')" = "$FINAL_UI_SHA256"
          test "$(sha256sum apps/desktop/src/state.rs | awk '{print $1}')" = "$BASE_STATE_SHA256"

          grep -Fq 'enum PlaceholderDestination {' apps/desktop/src/ui.rs
          grep -Fq 'fn placeholder_page(destination: PlaceholderDestination) -> gtk::Box {' apps/desktop/src/ui.rs
          grep -Fq "const fn placeholder_description(destination: PlaceholderDestination) -> &'static str {" apps/desktop/src/ui.rs
          grep -Fq 'NavigationDestination::Sessions => placeholder_page(PlaceholderDestination::Sessions),' apps/desktop/src/ui.rs
          grep -Fq 'placeholder_page(PlaceholderDestination::Transfers)' apps/desktop/src/ui.rs
          grep -Fq 'NavigationDestination::Machines => machines.clone(),' apps/desktop/src/ui.rs
          grep -Fq 'NavigationDestination::Files => files.clone(),' apps/desktop/src/ui.rs
          grep -Fq 'NavigationDestination::Activity => activity.clone(),' apps/desktop/src/ui.rs
          grep -Fq 'NavigationDestination::Settings => settings.clone(),' apps/desktop/src/ui.rs
          grep -Fq 'fn placeholder_contract_represents_only_session_and_transfer_routes()' apps/desktop/src/ui.rs
          if grep -Fq 'placeholder_page(destination)' apps/desktop/src/ui.rs; then
            echo 'broad NavigationDestination placeholder call unexpectedly remains' >&2
            exit 1
          fi
          if grep -Fq 'implemented destinations must not use placeholder descriptions' apps/desktop/src/ui.rs; then
            echo 'implemented-destination panic path unexpectedly remains' >&2
            exit 1
          fi

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config protobuf-compiler libgtk-4-dev libadwaita-1-dev

      - name: Focused placeholder type contract test
        run: cargo test --locked -p prw-desktop placeholder_contract_represents_only_session_and_transfer_routes -- --nocapture

      - name: Formatting check
        run: cargo fmt --check

      - name: Desktop tests
        run: cargo test --locked -p prw-desktop

      - name: Desktop compile check
        run: cargo check --locked -p prw-desktop

      - name: Desktop Clippy
        run: cargo clippy --locked -p prw-desktop --all-targets -- -D warnings
