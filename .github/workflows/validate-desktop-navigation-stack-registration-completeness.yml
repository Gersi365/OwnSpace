name: Ownspace Desktop navigation stack registration completeness validation

on:
  push:
    branches:
      - validation/desktop-navigation-stack-registration-completeness-2026-09-28

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validation carrier
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify exact carrier and candidate
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA='a4b2fa9b916c09280e00d8be38925edacdde0800'
          BASE_UI_SHA256='94b0cd49c43de5e2c1a6b1c1240dd2795d53035b0d6576860c2ce7883366bff1'
          BASE_STATE_SHA256='aa1ee9c4b61912e0a7a3c291269491780d4944c0fa197d17c75e5f135aba6941'
          PATCH_SHA256='8ee7ecbb9b6c70d57b5899078685993721dfa830326e4d19445da20fcb8e3311'
          FINAL_UI_SHA256='03ee06cfe9eefb24f98dc4ee31ff74426df5f27bfed525a7ac03a2df3d7d3466'
          PATCH='.github/validation/OWNSPACE_DESKTOP_NAVIGATION_STACK_REGISTRATION_COMPLETENESS_CANDIDATE_2026-09-28.patch'

          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test "$(sha256sum apps/desktop/src/ui.rs | awk '{print $1}')" = "$BASE_UI_SHA256"
          test "$(sha256sum apps/desktop/src/state.rs | awk '{print $1}')" = "$BASE_STATE_SHA256"
          test "$(sha256sum "$PATCH" | awk '{print $1}')" = "$PATCH_SHA256"

          git apply --check "$PATCH"
          git apply "$PATCH"
          git diff --check
          test "$(git diff --name-only)" = 'apps/desktop/src/ui.rs'
          test "$(sha256sum apps/desktop/src/ui.rs | awk '{print $1}')" = "$FINAL_UI_SHA256"
          test "$(sha256sum apps/desktop/src/state.rs | awk '{print $1}')" = "$BASE_STATE_SHA256"

          test "$(grep -Fxc '    for destination in NavigationDestination::ALL {' apps/desktop/src/ui.rs)" = '1'
          test "$(grep -Fc 'NavigationDestination::ALL.into_iter().skip(1)' apps/desktop/src/ui.rs)" = '0'
          test "$(grep -Fc 'NavigationDestination::Overview => continue' apps/desktop/src/ui.rs)" = '0'
          test "$(grep -Fc 'NavigationDestination::Overview => overview.clone()' apps/desktop/src/ui.rs)" = '1'
          test "$(grep -Fc 'NavigationDestination::Sessions => placeholder_page(PlaceholderDestination::Sessions)' apps/desktop/src/ui.rs)" = '1'
          test "$(grep -Fc 'NavigationDestination::Transfers => placeholder_page(PlaceholderDestination::Transfers)' apps/desktop/src/ui.rs)" = '1'
          test "$(grep -Fc 'stack.add_titled(&page, Some(destination.stack_name()), destination.title());' apps/desktop/src/ui.rs)" = '1'

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config protobuf-compiler libgtk-4-dev libadwaita-1-dev

      - name: Focused navigation presentation test
        run: cargo test --locked -p prw-desktop navigation_destinations_have_stable_presentation_contract -- --nocapture

      - name: Formatting check
        run: cargo fmt --check

      - name: Desktop tests
        run: cargo test --locked -p prw-desktop

      - name: Desktop compile check
        run: cargo check --locked -p prw-desktop

      - name: Desktop Clippy
        run: cargo clippy --locked -p prw-desktop --all-targets -- -D warnings
