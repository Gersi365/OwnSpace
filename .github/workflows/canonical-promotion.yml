name: Ownspace canonical source promotion

on:
  push:
    branches:
      - promotion/f4-canonical
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout promotion carrier
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify promotion preconditions
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_MAIN=d8abc22100e75a0eafd6a4b9a7c20aef7157b99c
          git fetch origin main
          ACTUAL_MAIN="$(git rev-parse origin/main)"
          test "$ACTUAL_MAIN" = "$EXPECTED_MAIN"
          echo "EXPECTED_MAIN=$EXPECTED_MAIN" >> "$GITHUB_ENV"
          echo "6b981dde40d5675620b7030b8b76c28fadfd89121caf0e5845f487ceeaaf87c4  source/Ownspace_Source_Current_2026-09-24.tar.gz" | sha256sum -c -
          echo "b2c137728846635c2f872fd3f2f8b059655505856b1988a5cac92f9268896742  source/OWNSPACE_SOURCE_MANIFEST_SHA256.txt" | sha256sum -c -
          echo "13608ead93378aad8fea2f76b9fd0b63bb8cee5dcf0512a54d4e60b6c8a1fb9f  candidate/OWNSPACE_TEMP_STARTUP_AUTHORITY_V4.patch" | sha256sum -c -
          echo "11eb59d62cfcb9da3057e3debcc10e4d48ff77a5279b30cfb2ee7244ef12c4f0  candidate/OWNSPACE_TEMP_ANDROID_UI_A1.patch" | sha256sum -c -
          echo "40b4655c51cbf33618830c8c2cef73ca2051049e1dd2dba23d3e4b65874deb96  candidate/OWNSPACE_TEMP_DESKTOP_UI_B1.patch" | sha256sum -c -
          echo "27d6b520d6e2e290913f7f86bbb5f0339e9b6735e259f70eea5fcf36ee44243e  candidate/OWNSPACE_TEMP_FORMAT_F1.patch" | sha256sum -c -
          echo "fe9af5847028b9086aa6f24e8b170525f27053f2eff01c69e43677a5c01f6ee9  candidate/OWNSPACE_TEMP_CLIPPY_F2.patch" | sha256sum -c -
          echo "da958bab9e7acb61a5d4a067152f6c9bbe6a4d7dc5285a91b130afac20dc267b  candidate/OWNSPACE_TEMP_CLIPPY_F3.patch" | sha256sum -c -
          echo "cbd0594268cb98f04cb917cb42185b113b93b387ecd1b308283a1c9ceffedf1d  candidate/OWNSPACE_TEMP_CLIPPY_F4.patch" | sha256sum -c -
          echo "e5807076a51243b40994cd3f0968074e4758010ef1cb522866e2e33c75902338  candidate/OWNSPACE_TEMP_COMBINED_V4_A1_B1_F4_MANIFEST_SHA256.txt" | sha256sum -c -

      - name: Reconstruct exact Drive-authoritative source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p promotion-work/source canonical-output
          tar -xzf source/Ownspace_Source_Current_2026-09-24.tar.gz -C promotion-work/source
          cd promotion-work/source
          test "$(find . -type f | wc -l | tr -d ' ')" = "372"
          sha256sum -c "$GITHUB_WORKSPACE/source/OWNSPACE_SOURCE_MANIFEST_SHA256.txt" >/dev/null
          patches=(
            "$GITHUB_WORKSPACE/candidate/OWNSPACE_TEMP_STARTUP_AUTHORITY_V4.patch"
            "$GITHUB_WORKSPACE/candidate/OWNSPACE_TEMP_ANDROID_UI_A1.patch"
            "$GITHUB_WORKSPACE/candidate/OWNSPACE_TEMP_DESKTOP_UI_B1.patch"
            "$GITHUB_WORKSPACE/candidate/OWNSPACE_TEMP_FORMAT_F1.patch"
            "$GITHUB_WORKSPACE/candidate/OWNSPACE_TEMP_CLIPPY_F2.patch"
            "$GITHUB_WORKSPACE/candidate/OWNSPACE_TEMP_CLIPPY_F3.patch"
            "$GITHUB_WORKSPACE/candidate/OWNSPACE_TEMP_CLIPPY_F4.patch"
          )
          for patch_file in "${patches[@]}"; do
            patch -p1 --dry-run < "$patch_file" >/dev/null
            patch -p1 < "$patch_file" >/dev/null
          done
          if find . -type f -name '*.rej' -print -quit | grep -q .; then exit 65; fi
          if find . -type f -name '*.orig' -print -quit | grep -q .; then exit 65; fi
          test "$(find . -type f | wc -l | tr -d ' ')" = "372"
          sha256sum -c "$GITHUB_WORKSPACE/candidate/OWNSPACE_TEMP_COMBINED_V4_A1_B1_F4_MANIFEST_SHA256.txt" >/dev/null
          find . -type f -print0 | sort -z | xargs -0 sha256sum > "$GITHUB_WORKSPACE/canonical-output/reconstructed-manifest.txt"
          cmp "$GITHUB_WORKSPACE/canonical-output/reconstructed-manifest.txt" "$GITHUB_WORKSPACE/candidate/OWNSPACE_TEMP_COMBINED_V4_A1_B1_F4_MANIFEST_SHA256.txt"
          echo "e5807076a51243b40994cd3f0968074e4758010ef1cb522866e2e33c75902338  $GITHUB_WORKSPACE/canonical-output/reconstructed-manifest.txt" | sha256sum -c -

      - name: Create exact canonical commit locally
        shell: bash
        run: |
          set -euo pipefail
          export GIT_INDEX_FILE="$RUNNER_TEMP/ownspace-canonical.index"
          rm -f "$GIT_INDEX_FILE"
          git read-tree --empty
          git --git-dir="$GITHUB_WORKSPACE/.git" --work-tree="$GITHUB_WORKSPACE/promotion-work/source" add -A
          TREE_SHA="$(git write-tree)"
          test "$(git ls-tree -r --name-only "$TREE_SHA" | wc -l | tr -d ' ')" = "372"
          COMMIT_SHA="$(echo 'chore: promote verified Ownspace source' | git -c user.name='Ownspace Validation' -c user.email='actions@users.noreply.github.com' commit-tree "$TREE_SHA" -p "$EXPECTED_MAIN")"
          test "$(git rev-parse "$COMMIT_SHA^")" = "$EXPECTED_MAIN"
          test "$(git ls-tree -r --name-only "$COMMIT_SHA" | wc -l | tr -d ' ')" = "372"
          mkdir -p canonical-checkout
          git archive "$COMMIT_SHA" | tar -x -C canonical-checkout
          cd canonical-checkout
          test "$(find . -type f | wc -l | tr -d ' ')" = "372"
          sha256sum -c "$GITHUB_WORKSPACE/candidate/OWNSPACE_TEMP_COMBINED_V4_A1_B1_F4_MANIFEST_SHA256.txt" >/dev/null
          cd "$GITHUB_WORKSPACE"
          echo "OWNSPACE_CANONICAL_COMMIT=$COMMIT_SHA" >> "$GITHUB_ENV"
          echo "OWNSPACE_CANONICAL_TREE=$TREE_SHA" >> "$GITHUB_ENV"
          echo "CANONICAL_COMMIT=$COMMIT_SHA" > canonical-output/canonical-revision.txt
          echo "CANONICAL_TREE=$TREE_SHA" >> canonical-output/canonical-revision.txt
          echo "SOURCE_FILES=372" >> canonical-output/canonical-revision.txt
          echo "SOURCE_MANIFEST_SHA256=e5807076a51243b40994cd3f0968074e4758010ef1cb522866e2e33c75902338" >> canonical-output/canonical-revision.txt

      - name: Install native build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates clang cmake desktop-file-utils libadwaita-1-dev libgtk-4-dev libssl-dev ninja-build perl pkg-config protobuf-compiler

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1
          rustup target add --toolchain 1.97.1 aarch64-linux-android x86_64-linux-android
          rustc --version
          cargo --version
          rustfmt --version
          cargo clippy --version

      - name: Install cargo-ndk
        shell: bash
        run: |
          cargo +1.97.1 install cargo-ndk --version 4.1.2 --locked
          cargo ndk --version

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Use runner Android SDK
        shell: bash
        run: |
          ANDROID_SDK=/usr/local/lib/android/sdk
          SDKMANAGER="$(find "$ANDROID_SDK/cmdline-tools" -type f -name sdkmanager -perm -u+x -print -quit)"
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK" >> "$GITHUB_ENV"
          echo "OWNSPACE_SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --version

      - name: Install Android platform and NDK
        shell: bash
        run: |
          yes | "$OWNSPACE_SDKMANAGER" --licenses >/dev/null || true
          "$OWNSPACE_SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools" "ndk;28.2.13676358"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/ndk/28.2.13676358"

      - name: Validate exact canonical commit
        shell: bash
        run: |
          set -euo pipefail
          cd canonical-checkout
          test "$(find . -type f | wc -l | tr -d ' ')" = "372"
          sha256sum -c "$GITHUB_WORKSPACE/candidate/OWNSPACE_TEMP_COMBINED_V4_A1_B1_F4_MANIFEST_SHA256.txt" >/dev/null
          cargo +1.97.1 metadata --locked --no-deps --format-version 1 >/dev/null
          cargo +1.97.1 fmt --all -- --check
          cargo +1.97.1 clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo +1.97.1 test --locked --workspace --all-targets
          cargo +1.97.1 build --locked --workspace --all-targets
          cd "$GITHUB_WORKSPACE"
          chmod +x validation/validate_ownspace_android_candidate.sh
          validation/validate_ownspace_android_candidate.sh --workspace "$GITHUB_WORKSPACE/canonical-checkout" --output "$GITHUB_WORKSPACE/canonical-output/android" --expected-main-sha256 6af8b3ee3ffa40bf8614594b827b442d93f611c06f4735dce7ed19d217fe37f7

      - name: Push validated canonical commit to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git push origin "$OWNSPACE_CANONICAL_COMMIT:refs/heads/main"
          REMOTE_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$REMOTE_MAIN" = "$OWNSPACE_CANONICAL_COMMIT"
          echo "VALIDATION_RESULT=PASS" >> canonical-output/canonical-revision.txt
          echo "REMOTE_MAIN=$REMOTE_MAIN" >> canonical-output/canonical-revision.txt
          echo "RUST_TOOLCHAIN=1.97.1" >> canonical-output/canonical-revision.txt
          echo "ANDROID_LINT=PASS" >> canonical-output/canonical-revision.txt
          echo "ANDROID_ASSEMBLE_DEBUG=PASS" >> canonical-output/canonical-revision.txt
          cat canonical-output/canonical-revision.txt

      - name: Upload canonical promotion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ownspace-canonical-promotion-evidence
          path: canonical-output/
          if-no-files-found: warn
          retention-days: 14
