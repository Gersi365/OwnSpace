name: Ownspace desktop placeholder copy contract canonical promotion

on:
  push:
    branches:
      - "promotion/desktop-placeholder-copy-contract-canonical-r1"

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout promotion carrier
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify promotion preconditions
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_MAIN=9e986a1ede30b845ab23921e330452f367d0bb2d
          EXPECTED_UI_BLOB=b5c290b1be135f71a07d03756162de7fbae15c54
          EXPECTED_UI_SHA256=17e393c0c384de4917d0d0a829e77bc40dd62ed7ce5e7584dce5d185bce0bb75
          EXPECTED_SOURCE_TREE=4d471688645c6e94ee275b681b1e9c54a4ac43e7
          EXPECTED_SOURCE_MANIFEST_SHA256=447050c915194a00aedb7a15f67681c35401d04708b0e2d323dd8cb00badef0f
          EXPECTED_ARCHIVE_SHA256=7595ad4df6d3a69fdf6a3560052d70d03be86dffd407f1ea6ceecf5a3cddcb44
          EXPECTED_ARCHIVE_BYTES=912571
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD:apps/desktop/src/ui.rs)" = "$EXPECTED_UI_BLOB"
          echo "$EXPECTED_UI_SHA256  apps/desktop/src/ui.rs" | sha256sum -c -
          mapfile -t changed < <(git diff --name-only "$EXPECTED_MAIN" HEAD | sort)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" = "2"
          test "${changed[0]}" = ".github/workflows/canonical-desktop-placeholder-copy-contract-promotion.yml"
          test "${changed[1]}" = "apps/desktop/src/ui.rs"
          {
            echo "EXPECTED_MAIN=$EXPECTED_MAIN"
            echo "EXPECTED_UI_BLOB=$EXPECTED_UI_BLOB"
            echo "EXPECTED_UI_SHA256=$EXPECTED_UI_SHA256"
            echo "EXPECTED_SOURCE_TREE=$EXPECTED_SOURCE_TREE"
            echo "EXPECTED_SOURCE_MANIFEST_SHA256=$EXPECTED_SOURCE_MANIFEST_SHA256"
            echo "EXPECTED_ARCHIVE_SHA256=$EXPECTED_ARCHIVE_SHA256"
            echo "EXPECTED_ARCHIVE_BYTES=$EXPECTED_ARCHIVE_BYTES"
          } >> "$GITHUB_ENV"

      - name: Construct clean source-only canonical candidate
        shell: bash
        run: |
          set -euo pipefail
          export GIT_INDEX_FILE="$RUNNER_TEMP/ownspace-placeholder-copy-contract-canonical.index"
          rm -f "$GIT_INDEX_FILE"
          git read-tree "$EXPECTED_MAIN^{tree}"
          UI_MODE="$(git ls-tree "$EXPECTED_MAIN" -- apps/desktop/src/ui.rs | awk '{print $1}')"
          test "$UI_MODE" = "100644"
          git update-index --add --cacheinfo "$UI_MODE" "$EXPECTED_UI_BLOB" apps/desktop/src/ui.rs
          TREE_SHA="$(git write-tree)"
          test "$TREE_SHA" = "$EXPECTED_SOURCE_TREE"
          test "$(git ls-tree -r --name-only "$TREE_SHA" | wc -l | tr -d ' ')" = "372"
          COMMIT_SHA="$(printf '%s\n' 'test(desktop): pin placeholder copy contract' | git -c user.name='Ownspace Validation' -c user.email='actions@users.noreply.github.com' commit-tree "$TREE_SHA" -p "$EXPECTED_MAIN")"
          test "$(git rev-parse "$COMMIT_SHA^")" = "$EXPECTED_MAIN"
          mkdir -p canonical-checkout canonical-output
          git archive "$COMMIT_SHA" | tar -x -C canonical-checkout
          echo "OWNSPACE_CANONICAL_COMMIT=$COMMIT_SHA" >> "$GITHUB_ENV"
          echo "OWNSPACE_CANONICAL_TREE=$TREE_SHA" >> "$GITHUB_ENV"
          {
            echo "OWNSPACE DESKTOP PLACEHOLDER COPY CONTRACT CANONICAL PROMOTION"
            echo "BASE_MAIN=$EXPECTED_MAIN"
            echo "CANONICAL_COMMIT=$COMMIT_SHA"
            echo "CANONICAL_TREE=$TREE_SHA"
            echo "SOURCE_FILES=372"
            echo "SOURCE_MANIFEST_SHA256=$EXPECTED_SOURCE_MANIFEST_SHA256"
            echo "UI_SHA256=$EXPECTED_UI_SHA256"
            echo "ARCHIVE_SHA256=$EXPECTED_ARCHIVE_SHA256"
            echo "ARCHIVE_BYTES=$EXPECTED_ARCHIVE_BYTES"
          } > canonical-output/canonical-revision.txt

      - name: Verify exact Drive-authoritative source identity
        shell: bash
        run: |
          set -euo pipefail
          cd canonical-checkout
          test "$(find . -type f | wc -l | tr -d ' ')" = "372"
          echo "$EXPECTED_UI_SHA256  ./apps/desktop/src/ui.rs" | sha256sum -c -
          find . -type f -print0 | sort -z | xargs -0 sha256sum > "$GITHUB_WORKSPACE/canonical-output/reconstructed-manifest.txt"
          echo "$EXPECTED_SOURCE_MANIFEST_SHA256  $GITHUB_WORKSPACE/canonical-output/reconstructed-manifest.txt" | sha256sum -c -
          tar --sort=name --mtime='2026-09-25 00:00:00 UTC' --owner=0 --group=0 --numeric-owner --format=gnu -cf - . | gzip -n -6 > "$GITHUB_WORKSPACE/canonical-output/reconstructed-source.tar.gz"
          echo "$EXPECTED_ARCHIVE_SHA256  $GITHUB_WORKSPACE/canonical-output/reconstructed-source.tar.gz" | sha256sum -c -
          test "$(wc -c < "$GITHUB_WORKSPACE/canonical-output/reconstructed-source.tar.gz" | tr -d ' ')" = "$EXPECTED_ARCHIVE_BYTES"

      - name: Install native build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            clang \
            cmake \
            desktop-file-utils \
            libadwaita-1-dev \
            libgtk-4-dev \
            libssl-dev \
            ninja-build \
            perl \
            pkg-config \
            protobuf-compiler

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.97.1
          rustc --version
          cargo --version
          rustfmt --version
          cargo clippy --version

      - name: Focused desktop validation
        shell: bash
        run: |
          set -euo pipefail
          cd canonical-checkout
          cargo +1.97.1 fmt --all -- --check
          cargo +1.97.1 test --locked -p prw-desktop

      - name: Full Rust workspace validation
        shell: bash
        run: |
          set -euo pipefail
          cd canonical-checkout
          cargo +1.97.1 metadata --locked --no-deps --format-version 1 >/dev/null
          cargo +1.97.1 clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo +1.97.1 test --locked --workspace --all-targets
          cargo +1.97.1 build --locked --workspace --all-targets
          {
            echo "FOCUSED_DESKTOP=PASS"
            echo "CARGO_METADATA=PASS"
            echo "CARGO_FMT=PASS"
            echo "CARGO_CLIPPY=PASS"
            echo "CARGO_TEST=PASS"
            echo "CARGO_BUILD=PASS"
          } >> "$GITHUB_WORKSPACE/canonical-output/canonical-revision.txt"

      - name: Advance canonical main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git push origin "$OWNSPACE_CANONICAL_COMMIT:refs/heads/main"
          REMOTE_MAIN="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$REMOTE_MAIN" = "$OWNSPACE_CANONICAL_COMMIT"
          {
            echo "VALIDATION_RESULT=PASS"
            echo "REMOTE_MAIN=$REMOTE_MAIN"
            echo "RUST_TOOLCHAIN=1.97.1"
          } >> canonical-output/canonical-revision.txt
          cat canonical-output/canonical-revision.txt

      - name: Upload canonical promotion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ownspace-desktop-placeholder-copy-contract-canonical-promotion
          path: canonical-output/
          if-no-files-found: warn
          retention-days: 14
