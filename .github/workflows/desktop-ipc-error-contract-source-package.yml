name: Ownspace desktop IPC error contract source package

on:
  push:
    branches:
      - "promotion/desktop-ipc-error-contract-r1"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout packaging carrier
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify validated source input
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_BASE=c2ed7696ca00da4d011ed8fd2ad2f0c028623cfb
          EXPECTED_IPC_BLOB=047e9e52a3389d5bf875fb56b50fb36aaf5da79c
          git cat-file -e "$EXPECTED_BASE^{commit}"
          git merge-base --is-ancestor "$EXPECTED_BASE" HEAD
          test "$(git rev-parse HEAD:apps/desktop/src/ipc.rs)" = "$EXPECTED_IPC_BLOB"
          echo "EXPECTED_BASE=$EXPECTED_BASE" >> "$GITHUB_ENV"
          echo "EXPECTED_IPC_BLOB=$EXPECTED_IPC_BLOB" >> "$GITHUB_ENV"

      - name: Construct source-only candidate
        shell: bash
        run: |
          set -euo pipefail
          export GIT_INDEX_FILE="$RUNNER_TEMP/ownspace-ipc-error-contract.index"
          rm -f "$GIT_INDEX_FILE"
          git read-tree "$EXPECTED_BASE^{tree}"
          IPC_MODE="$(git ls-tree "$EXPECTED_BASE" -- apps/desktop/src/ipc.rs | awk '{print $1}')"
          test "$IPC_MODE" = "100644"
          git update-index --add --cacheinfo "$IPC_MODE" "$EXPECTED_IPC_BLOB" apps/desktop/src/ipc.rs
          TREE_SHA="$(git write-tree)"
          test "$(git ls-tree -r --name-only "$TREE_SHA" | wc -l | tr -d ' ')" = "372"
          mkdir -p source package-output
          git archive "$TREE_SHA" | tar -x -C source
          test "$(find source -type f | wc -l | tr -d ' ')" = "372"
          cp source/apps/desktop/src/ipc.rs package-output/ipc.rs
          (
            cd source
            find . -type f -print0 | sort -z | xargs -0 sha256sum
          ) > package-output/OWNSPACE_SOURCE_MANIFEST_SHA256.txt
          (
            cd source
            tar --sort=name --mtime='2026-09-25 00:00:00 UTC' --owner=0 --group=0 --numeric-owner --format=gnu -cf - . | gzip -n -6
          ) > package-output/Ownspace_Source_Current_2026-09-25.tar.gz
          {
            echo "OWNSPACE DESKTOP IPC ERROR CONTRACT SOURCE PACKAGE"
            echo "BASE_MAIN=$EXPECTED_BASE"
            echo "VALIDATED_SOURCE_HEAD=f1fe4447853feeca38696f75b7c56c007acbb991"
            echo "SOURCE_TREE=$TREE_SHA"
            echo "SOURCE_FILES=372"
            echo "IPC_BLOB=$EXPECTED_IPC_BLOB"
            echo "IPC_SHA256=$(sha256sum package-output/ipc.rs | awk '{print $1}')"
            echo "MANIFEST_SHA256=$(sha256sum package-output/OWNSPACE_SOURCE_MANIFEST_SHA256.txt | awk '{print $1}')"
            echo "ARCHIVE_SHA256=$(sha256sum package-output/Ownspace_Source_Current_2026-09-25.tar.gz | awk '{print $1}')"
            echo "ARCHIVE_BYTES=$(wc -c < package-output/Ownspace_Source_Current_2026-09-25.tar.gz | tr -d ' ')"
          } > package-output/package-info.txt
          cat package-output/package-info.txt

      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: ownspace-desktop-ipc-error-contract-source-package
          path: package-output/
          if-no-files-found: error
          retention-days: 14
